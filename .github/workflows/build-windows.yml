# Full Argon Browser Windows x86_64 source build on GitHub Actions.
#
# Separates the heavy Windows Gecko compilation from fast PR checks in ci.yml.
#
# Runner requirements (verified against pinned Firefox d9bd6be9):
#   - OS: Windows 10/11 or Windows Server 2022+ (x64)
#   - RAM: 8 GB minimum, 16 GB+ recommended (with pagefile for Rust LTO & libxul)
#   - Disk: ~55-65 GB free space on an ASCII, space-free workspace path
#     (upstream source ~4 GB, objdir ~30 GB, .mozbuild/VS/LLVM/Rust ~12 GB)
#   - Runtime: ~90-240 minutes cold compile on 4 cores without warm sccache
#
# Standard GitHub-hosted `windows-latest` runner note:
#   Standard `windows-latest` runners have ~14-35 GB free before cleanup and
#   a hard 360-minute job timeout. This workflow prunes unused preinstalled SDKs
#   and caches before checkout and triggers on `push` to `main` / `v*` tags
#   (matching `.github/workflows/build.yml`) plus `workflow_dispatch` (where a
#   larger or self-hosted runner can also be selected via `inputs.runner`).
#   It never simulates or skips failed Gecko compilation.

name: Build Argon Browser (Windows)

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "Parallel compile jobs (--jobs)"
        required: false
        default: "2"
        type: string
      runner:
        description: "GitHub runner label (windows-latest, larger Windows runner, or self-hosted)"
        required: false
        default: "windows-latest"
        type: string
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: argon-build-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      runtime-run: ${{ steps.lookup.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Look for a tested runtime for packaging-only changes
        id: lookup
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(python3 scripts/find-win-runtime.py)
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ -n "$run" ]; then echo "Reusing tested runtime from run $run"; fi

  build-windows-x86_64:
    name: Full Argon build (win64)
    needs: plan
    if: needs.plan.outputs.runtime-run == ''
    runs-on: ${{ inputs.runner || 'windows-latest' }}
    timeout-minutes: 360
    env:
      MOZILLABUILD: C:\mozilla-build
    steps:
      - name: Check runner RAM/disk and free unused toolcaches
        shell: pwsh
        run: |
          $ramGiB = [math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB, 2)
          Write-Host "Host RAM: $ramGiB GiB"
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,2)}}, @{n='UsedGB';e={[math]::Round($_.Used/1GB,2)}}

          if (Get-Command Set-MpPreference -ErrorAction SilentlyContinue) {
            Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
          }

          $drives = Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Free -gt 0 } | Sort-Object Free -Descending
          $best = $drives[0]
          $freeGiB = [math]::Round($best.Free / 1GB, 2)
          $root = "$($best.Name):"

          if ($freeGiB -lt 65) {
            Write-Host "Largest drive $root has $freeGiB GiB free (< 65 GiB); freeing optional pre-installed toolcaches..."
            $targets = @(
              "C:\Android",
              "C:\Program Files (x86)\Android",
              "C:\ghcup",
              "C:\msys64",
              "C:\vcpkg",
              "C:\Strawberry",
              "C:\hostedtoolcache\windows\CodeQL",
              "C:\hostedtoolcache\windows\Java*",
              "C:\hostedtoolcache\windows\Ruby",
              "C:\hostedtoolcache\windows\PyPy",
              "C:\hostedtoolcache\windows\Go",
              "C:\hostedtoolcache\windows\boost",
              "C:\Program Files\Microsoft SDKs\Azure",
              "C:\Program Files (x86)\Microsoft SDKs\Azure",
              "C:\Program Files\dotnet\packs",
              "C:\ProgramData\chocolatey\lib",
              "$env:USERPROFILE\.nuget\packages"
            ) | ForEach-Object { Get-Item -Path $_ -ErrorAction SilentlyContinue } | ForEach-Object { $_.FullName }

            $targets | ForEach-Object -ThrottleLimit 8 -Parallel {
              Write-Host "Removing $_..."
              cmd /c "rd /s /q `"$_`" >nul 2>&1"
            }

            Write-Host "Disk space after cleanup:"
            Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,2)}}, @{n='UsedGB';e={[math]::Round($_.Used/1GB,2)}}
            $drives = Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Free -gt 0 } | Sort-Object Free -Descending
            $best = $drives[0]
            $freeGiB = [math]::Round($best.Free / 1GB, 2)
            $root = "$($best.Name):"
          } else {
            Write-Host "Skipping multi-minute C: cleanup because $root already has $freeGiB GiB free."
          }

          Write-Host "Selected largest drive $root ($freeGiB GiB free)"
          if ($freeGiB -lt 55) {
            Write-Warning "Only $freeGiB GiB free on $root; a cold Windows Gecko source build typically needs 55-65 GiB free. Standard GitHub-hosted windows-latest runners may run out of disk or exceed 360 minutes without a larger/self-hosted runner."
          }

          $argonWs = "$root\argon-build"
          $mozbuildState = "$root\.mozbuild"
          $cargoHome = "$root\.cargo"
          $rustupHome = "$root\.rustup"
          $tempDir = "$root\temp"
          New-Item -ItemType Directory -Path $tempDir -Force | Out-Null

          "ARGON_WORKSPACE=$argonWs" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MOZBUILD_STATE_PATH=$mozbuildState" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_HOME=$cargoHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RUSTUP_HOME=$rustupHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TEMP=$tempDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$tempDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MACH_HIDE_DEV_DRIVE_SUGGESTION=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          if (Get-Command Add-MpPreference -ErrorAction SilentlyContinue) {
            foreach ($exDir in @($argonWs, $mozbuildState, $cargoHome, $rustupHome, $tempDir, $env:MOZILLABUILD, $env:GITHUB_WORKSPACE)) {
              if ($exDir) {
                Add-MpPreference -ExclusionPath $exDir -ErrorAction SilentlyContinue
              }
            }
          }

      - name: Add Windows pagefile on build drive for Rust LTO and xul.dll linking
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $drive = Split-Path -Qualifier $env:ARGON_WORKSPACE
          if (-not $drive) { $drive = "D:" }
          $freeGiB = [math]::Round(((Get-PSDrive -Name $drive.TrimEnd(':')).Free) / 1GB, 2)
          Write-Host "Build drive $drive free space: $freeGiB GiB"
          Write-Host "Virtual memory before pagefile configuration:"
          Get-CimInstance Win32_PageFileUsage -ErrorAction SilentlyContinue | Format-Table Name, AllocatedBaseSize, CurrentUsage, PeakUsage
          $osBefore = Get-CimInstance Win32_OperatingSystem
          Write-Host ("TotalVisibleMemorySize={0} MiB TotalVirtualMemorySize={1} MiB FreeVirtualMemory={2} MiB" -f `
            [math]::Round($osBefore.TotalVisibleMemorySize / 1024),
            [math]::Round($osBefore.TotalVirtualMemorySize / 1024),
            [math]::Round($osBefore.FreeVirtualMemory / 1024))

          $targetCommitKB = 30 * 1024 * 1024
          if ($osBefore.TotalVirtualMemorySize -lt $targetCommitKB -and $freeGiB -ge 65) {
            $minBytes = if ($freeGiB -ge 90) { [int64]16 * 1024 * 1024 * 1024 } else { [int64]8 * 1024 * 1024 * 1024 }
            $maxBytes = if ($freeGiB -ge 90) { [int64]24 * 1024 * 1024 * 1024 } else { [int64]12 * 1024 * 1024 * 1024 }
            $code = @'
          using System;
          using System.ComponentModel;
          using System.Diagnostics;
          using System.Runtime.InteropServices;
          using System.Text;
          using Microsoft.Win32.SafeHandles;

          namespace ArgonCi {
            public static class NativePagefile {
              [StructLayout(LayoutKind.Sequential)]
              internal struct LUID {
                internal uint LowPart;
                internal uint HighPart;
              }
              [StructLayout(LayoutKind.Sequential)]
              internal struct LUID_AND_ATTRIBUTES {
                internal LUID Luid;
                internal uint Attributes;
              }
              [StructLayout(LayoutKind.Sequential)]
              internal struct TOKEN_PRIVILEGE {
                internal uint PrivilegeCount;
                internal LUID_AND_ATTRIBUTES Privilege;
                internal static readonly uint Size = (uint)Marshal.SizeOf(typeof(TOKEN_PRIVILEGE));
              }
              [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Unicode)]
              internal struct UNICODE_STRING {
                internal ushort Length;
                internal ushort MaximumLength;
                internal string Buffer;
              }
              internal sealed class SafeCloseHandle : SafeHandleZeroOrMinusOneIsInvalid {
                private SafeCloseHandle() : base(true) {}
                [DllImport("kernel32.dll", ExactSpelling = true, SetLastError = true)]
                internal static extern bool CloseHandle(IntPtr handle);
                protected override bool ReleaseHandle() { return CloseHandle(handle); }
              }
              [DllImport("advapi32.dll", ExactSpelling = true, CharSet = CharSet.Unicode, SetLastError = true, PreserveSig = false)]
              internal static extern bool LookupPrivilegeValueW(string lpSystemName, string lpName, out LUID luid);
              [DllImport("advapi32.dll", SetLastError = true, PreserveSig = false)]
              internal static extern bool AdjustTokenPrivileges(SafeCloseHandle tokenHandle, bool disableAll, ref TOKEN_PRIVILEGE newState, uint bufferLength, out TOKEN_PRIVILEGE prevState, out uint returnLength);
              [DllImport("advapi32.dll", CharSet = CharSet.Auto, SetLastError = true, PreserveSig = false)]
              internal static extern bool OpenProcessToken(IntPtr processToken, int desiredAccess, out SafeCloseHandle tokenHandle);
              [DllImport("ntdll.dll", CharSet = CharSet.Unicode, CallingConvention = CallingConvention.StdCall)]
              internal static extern int NtCreatePagingFile(ref UNICODE_STRING pageFileName, ref long minimumSize, ref long maximumSize, uint flags);
              [DllImport("kernel32.dll", CharSet = CharSet.Unicode, SetLastError = true)]
              internal static extern uint QueryDosDeviceW(string lpDeviceName, StringBuilder lpTargetPath, int ucchMax);

              public static int Create(string drive, string fileName, long minBytes, long maxBytes) {
                LUID luid;
                LookupPrivilegeValueW(null, "SeCreatePagefilePrivilege", out luid);
                SafeCloseHandle hToken;
                OpenProcessToken(Process.GetCurrentProcess().Handle, 0x0020 | 0x0008, out hToken);
                using (hToken) {
                  TOKEN_PRIVILEGE newState = new TOKEN_PRIVILEGE {
                    PrivilegeCount = 1,
                    Privilege = new LUID_AND_ATTRIBUTES { Luid = luid, Attributes = 0x00000002 }
                  };
                  TOKEN_PRIVILEGE prevState;
                  uint retLen = 0;
                  AdjustTokenPrivileges(hToken, false, ref newState, TOKEN_PRIVILEGE.Size, out prevState, out retLen);
                }
                var sb = new StringBuilder(260);
                if (QueryDosDeviceW(drive, sb, sb.Capacity) == 0) {
                  throw new Win32Exception(Marshal.GetLastWin32Error());
                }
                string ntPath = sb.ToString() + "\\" + fileName;
                var ustr = new UNICODE_STRING {
                  Length = (ushort)(ntPath.Length * 2),
                  MaximumLength = (ushort)((ntPath.Length + 1) * 2),
                  Buffer = ntPath
                };
                return NtCreatePagingFile(ref ustr, ref minBytes, ref maxBytes, 0);
              }
            }
          }
          '@
            Add-Type -TypeDefinition $code
            $status = [ArgonCi.NativePagefile]::Create($drive, "pagefile.sys", $minBytes, $maxBytes)
            if ($status -ne 0) {
              Write-Host ("NtCreatePagingFile(pagefile.sys) returned NTSTATUS 0x{0:X8}; trying pagefile-argon.sys..." -f $status)
              $status = [ArgonCi.NativePagefile]::Create($drive, "pagefile-argon.sys", $minBytes, $maxBytes)
            }
            if ($status -ne 0) {
              throw ("Failed to configure Windows pagefile on {0}: NTSTATUS 0x{1:X8}" -f $drive, $status)
            }
            Write-Host "Virtual memory after pagefile configuration:"
            Get-CimInstance Win32_PageFileUsage -ErrorAction SilentlyContinue | Format-Table Name, AllocatedBaseSize, CurrentUsage, PeakUsage
            $osAfter = Get-CimInstance Win32_OperatingSystem
            Write-Host ("TotalVisibleMemorySize={0} MiB TotalVirtualMemorySize={1} MiB FreeVirtualMemory={2} MiB" -f `
              [math]::Round($osAfter.TotalVisibleMemorySize / 1024),
              [math]::Round($osAfter.TotalVirtualMemorySize / 1024),
              [math]::Round($osAfter.FreeVirtualMemory / 1024))
          } else {
            Write-Host "Pagefile expansion not needed (TotalVirtualMemorySize=$([math]::Round($osBefore.TotalVirtualMemorySize / 1024)) MiB, Free=$freeGiB GiB)."
          }

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run fast unit, contract, and Windows packaging tests before building
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/adblock-policy.mjs verify --evidence docs/parity-evidence.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:python
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:dev
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/run-python.mjs -m unittest discover -s tests/windows -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Ensure MozillaBuild >= 4.0 and NSIS are available
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path "$env:MOZILLABUILD\start-shell.bat")) {
            choco install mozillabuild -y --no-progress
          }
          if (-not (Test-Path "$env:MOZILLABUILD\msys2\usr\bin\sh.exe")) {
            throw "MozillaBuild sh.exe missing under $env:MOZILLABUILD"
          }
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue) -and -not (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe") -and -not (Get-ChildItem "$env:MOZILLABUILD\nsis*\makensis.exe" -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
          }
          if (Test-Path "C:\Program Files (x86)\NSIS") {
            "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          if (Test-Path "$env:MOZILLABUILD\VERSION") {
            Write-Host "MozillaBuild VERSION: $(Get-Content "$env:MOZILLABUILD\VERSION")"
          }

      - name: Initialize Argon workspace before cache restore
        run: node scripts/run-python.mjs -c "import sys; sys.path.insert(0, 'scripts'); import argon; argon.Workspace(argon.REPO, argon.default_workspace()).claim()"

      - name: Restore Mozilla toolchains and pinned source archive
        id: toolchains
        uses: actions/cache/restore@v4
        with:
          path: &toolchain-paths |
            ${{ env.MOZBUILD_STATE_PATH }}\clang
            ${{ env.MOZBUILD_STATE_PATH }}\cbindgen
            ${{ env.MOZBUILD_STATE_PATH }}\node
            ${{ env.MOZBUILD_STATE_PATH }}\nasm
            ${{ env.MOZBUILD_STATE_PATH }}\pkgconf
            ${{ env.MOZBUILD_STATE_PATH }}\dump_syms
            ${{ env.MOZBUILD_STATE_PATH }}\wasi-sysroot
            ${{ env.MOZBUILD_STATE_PATH }}\vs
            ${{ env.MOZBUILD_STATE_PATH }}\nsis
            ${{ env.MOZBUILD_STATE_PATH }}\indices
            ${{ env.CARGO_HOME }}\bin
            ${{ env.RUSTUP_HOME }}
            ${{ env.ARGON_WORKSPACE }}\cache
          key: argon-toolchains-win64-${{ hashFiles('config/firefox.lock.json') }}

      - name: Fetch pinned Firefox source and apply Argon fork changes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm run fetch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run apply
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Bootstrap compilers/SDK and inspect doctor report
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Pre-seed CARGO_HOME\bin and RUSTUP_HOME default toolchain if rustup exists on runner without a toolchain in $RUSTUP_HOME.
          $preCargoBin = Join-Path $env:USERPROFILE ".cargo\bin"
          $cargoBin = Join-Path $env:CARGO_HOME "bin"
          if ((Test-Path $preCargoBin) -and -not (Test-Path (Join-Path $cargoBin "rustup.exe"))) {
            New-Item -ItemType Directory -Path $cargoBin -Force | Out-Null
            Copy-Item -Path (Join-Path $preCargoBin "*.exe") -Destination $cargoBin -Force -ErrorAction SilentlyContinue
          }
          if (Test-Path $cargoBin) {
            $cargoBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            $env:Path = "$cargoBin;$env:Path"
          }
          $rustupExe = Get-Command rustup -ErrorAction SilentlyContinue
          if ($rustupExe) {
            $toolchains = (& $rustupExe.Source toolchain list 2>&1 | Out-String)
            if ($toolchains -notmatch '\(default\)') {
              & $rustupExe.Source toolchain install stable --profile minimal --no-self-update
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              & $rustupExe.Source default stable
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
          npm run bootstrap
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run doctor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Save toolchains immediately after successful bootstrap
        if: steps.toolchains.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: *toolchain-paths
          key: ${{ steps.toolchains.outputs.cache-primary-key }}

      - name: Build Argon Browser (dist/bin/argon.exe)
        env:
          CARGO_INCREMENTAL: "0"
        run: node scripts/run-python.mjs scripts/argon.py --jobs "${{ inputs.jobs || '2' }}" build

      - name: Verify independent Argon application identity
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bin = Join-Path $env:ARGON_WORKSPACE "obj\dist\bin\argon.exe"
          $appIni = Join-Path $env:ARGON_WORKSPACE "obj\dist\bin\application.ini"
          if (-not (Test-Path $bin)) { throw "Missing $bin" }
          if (-not (Test-Path $appIni)) { throw "Missing $appIni" }
          $ini = Get-Content $appIni
          $ini | Write-Host
          foreach ($expected in @("Name=Argon", "Vendor=Argon", "Profile=argon", "RemotingName=argon")) {
            if ($ini -notcontains $expected) { throw "application.ini missing $expected" }
          }
          $vi = (Get-Item $bin).VersionInfo
          Write-Host "PE ProductName='$($vi.ProductName)' FileDescription='$($vi.FileDescription)' ProductVersion='$($vi.ProductVersion)'"
          if ("$($vi.ProductName) $($vi.FileDescription)" -notmatch "Argon") {
            throw "PE VersionInfo missing Argon identity on $bin"
          }
          $ver = (& $bin --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "argon.exe --version exited with $LASTEXITCODE" }
          Write-Host "argon.exe --version -> '$ver'"
          if ($ver -and $ver -notmatch "Argon") { throw "argon.exe --version did not report Argon" }

      - name: Run Marionette browser regression suites against compiled Argon binary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node scripts/run-python.mjs -m venv .cache\ci-venv
          .cache\ci-venv\Scripts\python.exe -m pip install -r tests\browser\requirements.txt
          $testRuntime = Join-Path $env:ARGON_WORKSPACE "obj\dist\argon-test-runtime"
          try {
            node scripts/run-python.mjs scripts/argon.py stage-runtime --output $testRuntime
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $env:ARGON_TEST_BINARY = Join-Path $testRuntime "argon.exe"
            foreach ($suite in @(
              "tests/browser/test_chrome.py",
              "tests/browser/test_adblock.py",
              "tests/browser/test_ublock_cosmetic.py",
              "tests/browser/test_ghostprint.py",
              "tests/browser/test_workspaces.py",
              "tests/browser/test_customization.py",
              "tests/browser/test_onboarding.py",
              "tests/browser/test_settings.py",
              "tests/browser/test_i18n.py"
            )) {
              Write-Host "Running $suite..."
              & .cache\ci-venv\Scripts\python.exe $suite
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          } finally {
            if (Test-Path $testRuntime) {
              Remove-Item -Path $testRuntime -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Stage the tested runtime and its smoke-test evidence
        shell: pwsh
        run: |
          node scripts/run-python.mjs scripts/argon.py package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dist = Join-Path $env:ARGON_WORKSPACE 'obj\dist'
          $zips = @(Get-ChildItem -LiteralPath $dist -File -Filter 'argon-*.win64.zip')
          if ($zips.Count -ne 1) { throw "Expected one win64 runtime ZIP; found $($zips.Count)" }
          New-Item -ItemType Directory 'win64-build-input' | Out-Null
          Copy-Item -LiteralPath $zips[0].FullName -Destination 'win64-build-input'
          Copy-Item "$dist\bin\application.ini", 'artifacts/chrome-smoke' -Destination 'win64-build-input' -Recurse

      - name: Upload tested build input for independent packaging retries
        uses: actions/upload-artifact@v4
        with:
          name: argon-win64-build-input
          path: win64-build-input/
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 14

  package-windows:
    name: Package and verify (win64)
    needs: [plan, build-windows-x86_64]
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      (needs.build-windows-x86_64.result == 'success' ||
      (needs.build-windows-x86_64.result == 'skipped' && needs.plan.outputs.runtime-run != ''))
    runs-on: ${{ inputs.runner || 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: argon-win64-build-input
          run-id: ${{ needs.plan.outputs.runtime-run || github.run_id }}
          github-token: ${{ github.token }}
          path: win64-build-input

      - name: Prepare the Windows packaging tools
        shell: pwsh
        run: |
          $probe = "import sys; sys.path.insert(0, 'scripts'); import win_package; print(win_package.find_makensis() or '')"
          $nsis = python -c $probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not $nsis) {
            if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
              throw 'Install NSIS or set ARGON_MAKENSIS on this runner; Chocolatey is unavailable.'
            }
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $nsis = python -c $probe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not $nsis -or -not (Test-Path -LiteralPath $nsis)) { throw 'NSIS not found after setup' }
          "ARGON_MAKENSIS=$nsis" >> $env:GITHUB_ENV

      - name: Test current Windows packaging code when reusing a prior runtime
        if: needs.plan.outputs.runtime-run != ''
        run: python -m unittest discover -s tests/windows -v

      - name: Build and verify the portable ZIP and NSIS installer from the runtime ZIP
        shell: pwsh
        run: |
          $zips = @(Get-ChildItem win64-build-input -File -Filter 'argon-*.win64.zip')
          if ($zips.Count -ne 1) { throw "Expected one downloaded win64 runtime ZIP; found $($zips.Count)" }
          $archive = $zips[0]
          New-Item -ItemType Directory 'win64-release' | Out-Null
          $portable = "win64-release/$($archive.BaseName)-portable.zip"
          $installer = "win64-release/$($archive.BaseName).installer.exe"
          python scripts/win_package.py portable --archive $archive.FullName --output $portable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/win_package.py installer --archive $archive.FullName --output $installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/win_package.py verify --portable $portable --installer $installer --checksums win64-release/SHA256SUMS --require-full-omni --run-portable-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content win64-release/SHA256SUMS
          Copy-Item 'win64-build-input/application.ini', 'win64-build-input/chrome-smoke' -Destination 'win64-release' -Recurse

      - name: Upload packaged Windows portable ZIP, installer, and verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: argon-windows-x86_64
          path: win64-release/
          if-no-files-found: error
          overwrite: true

  publish-windows:
    name: Publish verified Windows release
    needs: package-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: argon-windows-x86_64
          path: win64-release
      - name: Publish GitHub Release (tagged builds)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location win64-release
          $distDir = (Get-Location).Path
          $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
          $prerelease = @()
          if ($tag -match '(?i)(alpha|beta|rc)') {
            $prerelease = @("--prerelease")
          }
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Argon Browser $tag" --generate-notes @prerelease
          }
          # Linux publishes its own SHA256SUMS to this same release.
          Copy-Item SHA256SUMS SHA256SUMS-win64
          $assets = Get-ChildItem -File | Where-Object {
            $_.Name -like "argon-*.win64-portable.zip" -or
            $_.Name -like "argon-*.win64.installer.exe" -or
            $_.Name -eq "SHA256SUMS-win64"
          } | ForEach-Object { $_.FullName }
          gh release upload $tag --clobber @assets
